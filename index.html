<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極速刷題神器 (終極改版)</title>
    <script>
        const initDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', initDark ? 'dark' : 'light');
    </script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --container-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --primary: #4299e1;
            --primary-hover: #3182ce;
            --success: #48bb78;
            --danger: #e53e3e;
            --warning: #ed8936;
            --btn-text: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --container-bg: #2d3748;
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
            --border-color: #4a5568;
            --primary: #63b3ed;
            --primary-hover: #4299e1;
            --success: #68d391;
            --danger: #fc8181;
            --warning: #f6ad55;
            --btn-text: #1a202c;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        * { box-sizing: border-box; transition: background-color 0.25s ease, color 0.2s, border-color 0.2s; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 20px; display: flex; justify-content: center;
        }

        .container {
            max-width: 800px; width: 100%; background: var(--container-bg);
            padding: 30px; border-radius: 16px; box-shadow: var(--shadow);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px;
        }
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; }

        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; padding: 12px 16px; font-size: 16px; }
        .btn-theme { background-color: var(--border-color); color: var(--text-main); }
        .btn-primary { background-color: var(--primary); color: var(--btn-text); width: 100%; margin-top: 10px; }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-warning { background-color: var(--warning); color: #fff; width: 100%; margin-bottom: 15px; font-size: 16px; padding: 15px; animation: pulse 2s infinite;}
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.85; } 100% { opacity: 1; } }

        .section { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .section.active { display: block; opacity: 1; }

        input[type="text"], textarea, select {
            width: 100%; background-color: var(--bg-color); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 12px;
            font-size: 16px; margin-bottom: 10px;
        }
        textarea { height: 120px; resize: vertical; font-family: monospace; }

        .controls { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .controls > div { flex: 1; min-width: 120px; }
        .controls label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-muted); font-weight: 500;}

        .stats {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
            background-color: var(--bg-color); padding: 15px 20px; border-radius: 12px; 
            margin-bottom: 20px; font-size: 14px; font-weight: 500;
        }

        .question-box { font-size: 22px; line-height: 1.6; margin: 30px 0; font-weight: 600; letter-spacing: 0.5px;}
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background-color: var(--bg-color); color: var(--text-main);
            border: 2px solid var(--border-color); text-align: left; padding: 16px; font-size: 18px;
            border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: var(--border-color); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; transform: none; }
        .option-btn.correct { background-color: var(--success); color: #fff; border-color: var(--success); }
        .option-btn.wrong { background-color: var(--danger); color: #fff; border-color: var(--danger); }

        .feedback { margin-top: 25px; padding: 20px; border-radius: 12px; display: none; }
        .feedback.show { display: block; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .feedback.correct { background-color: rgba(72, 187, 120, 0.15); border-left: 6px solid var(--success); }
        .feedback.wrong { background-color: rgba(229, 62, 62, 0.15); border-left: 6px solid var(--danger); }
        .feedback h3 { margin: 0 0 10px 0; display: flex; align-items: center; gap: 10px;}
        .feedback p { margin: 6px 0; font-size: 16px; line-height: 1.5;}
        .word-highlight { font-weight: 700; color: var(--primary); font-size: 20px;}
        .time-tag { display: block; text-align: center; margin-top: 12px; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 8px; background: var(--bg-color); color: var(--text-muted); }
        .sys-msg { color: var(--success); font-size: 14px; margin-top: 10px; display: none; }
        .badge { background: var(--danger); color: white; padding: 3px 8px; border-radius: 6px; font-size: 12px; vertical-align: middle; margin-left: 5px; font-weight: 600;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>極速刷題神器</h1>
        <button class="btn-theme" id="themeToggle" onclick="toggleTheme()">淺色模式</button>
    </div>

    <!-- 步驟一：題庫匯入區 -->
    <div id="setupSection" class="section active">
        <h2>1. 匯入題庫</h2>
        <div style="background: var(--bg-color); padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <h3 style="margin-top: 0; font-size: 16px;">▶ 方式 A：一鍵載入 (推薦)</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: -5px;">留空將自動抓取預設題庫。</p>
            <input type="text" id="dbUrl" placeholder="如需更換，請輸入檔名或網址 (例: vocab.txt)">
            <button class="btn-primary" onclick="fetchDataFromUrl()" id="fetchBtn">載入並儲存題庫</button>
        </div>

        <div style="background: var(--bg-color); padding: 20px; border-radius: 12px;">
            <h3 style="margin-top: 0; font-size: 16px;">▶ 方式 B：手動貼上</h3>
            <textarea id="rawText" placeholder="將題庫純文字貼在此處..."></textarea>
            <button class="btn-primary" onclick="processManualData()">解析並儲存題庫</button>
        </div>

        <div id="setupMsg" class="sys-msg"></div>
        <hr style="border: 1px solid var(--border-color); margin: 25px 0;">
        <button class="btn-theme" style="width: 100%;" onclick="showSection('configSection')">已經有題庫了？跳過匯入</button>
    </div>

    <!-- 步驟二：測驗設定區 -->
    <div id="configSection" class="section">
        <h2>2. 測驗設定</h2>
        <div class="stats" id="dbStats">載入中...</div>
        
        <button id="resumeBtn" class="btn-warning" style="display:none;" onclick="resumeCasualSession()">
            ▶ 發現未完成的「順順考」進度，點擊繼續上次測驗！
        </button>

        <div class="controls">
            <div>
                <label>測驗模式</label>
                <select id="quizMode" onchange="toggleModeDesc()">
                    <option value="casual">順順考 (單元推進 + 錯題補考)</option>
                    <option value="sm2">循序漸進 (經典 SM-2 演算法)</option>
                </select>
            </div>
            <div>
                <label>選項數量</label>
                <select id="optCount">
                    <option value="4">4 選 1</option>
                    <option value="3">3 選 1</option>
                </select>
            </div>
            <div>
                <label>出題順序 (僅限順順考)</label>
                <select id="optOrder">
                    <option value="sequential">依序出題</option>
                    <option value="random">隨機打亂</option>
                </select>
            </div>
        </div>
        
        <p id="modeDesc" style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; background: var(--bg-color); padding: 12px; border-radius: 8px;"></p>

        <div class="controls">
            <div>
                <label>起始小節</label>
                <select id="startUnit"></select>
            </div>
            <div style="flex: 0.1; display:flex; align-items:center; justify-content:center; padding-top:20px; font-weight:bold;">至</div>
            <div>
                <label>結束小節</label>
                <select id="endUnit"></select>
            </div>
        </div>

        <button id="startBtn" class="btn-primary" onclick="startNewQuiz()" style="padding: 16px; font-size: 18px; margin-top: 10px;">開始測驗</button>
        <button class="btn-theme" style="width: 100%; margin-top: 15px;" onclick="showSection('setupSection')">重新匯入新題庫</button>
        <button id="clearBtn" class="btn-theme" style="width: 100%; margin-top: 15px; color: var(--danger); background: rgba(229,62,62,0.1);" onclick="clearAllProgress()">清除所有學習與錯題紀錄</button>
    </div>

    <!-- 步驟三：刷題區 -->
    <div id="quizSection" class="section">
        <div class="stats" id="quizStatsBox">
            <!-- 狀態將由 JS 動態填入 -->
        </div>
        
        <div class="question-box" id="questionText">載入題目中...</div>
        <div class="options" id="optionsContainer"></div>

        <div id="feedbackBox" class="feedback">
            <h3 id="feedbackTitle">結果</h3>
            <p><span class="word-highlight" id="fbWord">Word</span> <span id="fbTranslation" style="color:var(--text-muted);">翻譯</span></p>
            <p id="fbSentence">完整例句</p>
            <hr style="border: 1px solid var(--border-color); margin: 15px 0;">
            <p style="font-size: 14px; color: var(--text-muted);" id="fbOtherOptions">其他選項解釋</p>
            <button class="btn-primary" style="margin-top: 15px;" id="nextBtn" onclick="nextQuestion()">下一題 (Enter)</button>
            <div class="time-tag" id="fbTimeBadge">⏱️ 0.0 秒</div>
        </div>
        
        <button class="btn-theme" style="margin-top: 30px; width: 100%;" onclick="showSection('configSection')">暫停測驗並返回設定</button>
    </div>
</div>

<script>
    let wordDatabase = [];
    let currentMode = 'casual'; 
    let currentQuizPool = [];
    let currentQuestion = null;
    let questionStartTime = 0;
    let quizSettings = { count: 4, order: 'sequential' };
    
    // SM-2 全域狀態記憶
    let sm2Progress = JSON.parse(localStorage.getItem('sm2Progress')) || {};
    let globalTurn = parseInt(localStorage.getItem('globalTurn')) || 0;

    // 順順考狀態記憶
    let casualState = JSON.parse(localStorage.getItem('casualSession')) || null;

    // 雙擊確認計時器
    let clearConfirmTimer = null;
    let startConfirmTimer = null;

    // 不規則動詞大全
    const irregularMap = {
        'weep': ['wept'], 'buy': ['bought'], 'bring': ['brought'], 'catch': ['caught'], 
        'think': ['thought'], 'teach': ['taught'], 'seek': ['sought'], 'sell': ['sold'], 
        'tell': ['told'], 'find': ['found'], 'have': ['had', 'has'], 'do': ['did', 'done', 'does'], 
        'go': ['went', 'gone', 'goes'], 'see': ['saw', 'seen'], 'take': ['took', 'taken'], 
        'give': ['gave', 'given'], 'eat': ['ate', 'eaten'], 'fall': ['fell', 'fallen'], 
        'write': ['wrote', 'written'], 'speak': ['spoke', 'spoken'], 'break': ['broke', 'broken'], 
        'drive': ['drove', 'driven'], 'run': ['ran'], 'come': ['came'], 'know': ['knew', 'known'], 
        'fly': ['flew', 'flown'], 'grow': ['grew', 'grown'], 'throw': ['threw', 'thrown'], 
        'begin': ['began', 'begun'], 'sing': ['sang', 'sung'], 'swim': ['swam', 'swum'], 
        'drink': ['drank', 'drunk'], 'hide': ['hid', 'hidden'], 'choose': ['chose', 'chosen'], 
        'forget': ['forgot', 'forgotten'], 'get': ['got', 'gotten'], 'keep': ['kept'], 
        'sleep': ['slept'], 'leave': ['left'], 'feel': ['felt'], 'meet': ['met'], 
        'lead': ['led'], 'lose': ['lost'], 'make': ['made'], 'pay': ['paid'], 
        'say': ['said'], 'send': ['sent'], 'spend': ['spent'], 'build': ['built'], 
        'hear': ['heard'], 'understand': ['understood']
    };

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('themeToggle');
        if (btn) btn.innerText = theme === 'dark' ? '淺色模式' : '深色模式';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    const systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    applyTheme(systemThemeMedia.matches ? 'dark' : 'light');
    systemThemeMedia.addEventListener('change', e => {
        applyTheme(e.matches ? 'dark' : 'light');
    });

    function showSection(sectionId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
        if(sectionId === 'configSection') updateConfigUI();
    }

    function toggleModeDesc() {
        const mode = document.getElementById('quizMode').value;
        const desc = document.getElementById('modeDesc');
        if(mode === 'casual') {
            desc.innerHTML = "💡 <b>順順考</b>：照著單元順序一題一題刷。答錯的字會先丟進「錯題池」，等該節結束再抓出來考到對為止。中途離開會自動存檔，適合剛開始背單字打底。";
        } else {
            desc.innerHTML = "💡 <b>循序漸進 (SM-2 + 作答計時)</b>：依句長動態計算反應時間。<b>秒殺答對</b>會大幅拉長複習間距，<b>猶豫過久</b>會縮短間距，<b>答錯</b>則優先插隊重考。";
        }
    }

    function resetConfirmButtons() {
        clearTimeout(startConfirmTimer);
        clearTimeout(clearConfirmTimer);
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        if (startBtn) {
            delete startBtn.dataset.confirmed;
            startBtn.innerText = '開始測驗';
        }
        if (clearBtn) {
            delete clearBtn.dataset.confirmed;
            clearBtn.innerText = '清除所有學習與錯題紀錄';
        }
    }

    function clearAllProgress() {
        const btn = document.getElementById('clearBtn');
        if (!btn.dataset.confirmed) {
            btn.dataset.confirmed = 'true';
            btn.innerText = '⚠️ 確定清除？3 秒內再按一次確認';
            clearConfirmTimer = setTimeout(() => {
                delete btn.dataset.confirmed;
                btn.innerText = '清除所有學習與錯題紀錄';
            }, 3000);
            return;
        }

        clearTimeout(clearConfirmTimer);
        delete btn.dataset.confirmed;
        localStorage.removeItem('sm2Progress');
        localStorage.removeItem('globalTurn');
        localStorage.removeItem('casualSession');
        sm2Progress = {}; globalTurn = 0; casualState = null;
        updateConfigUI();
        btn.innerText = '✅ 紀錄已完全清除！';
        setTimeout(() => { btn.innerText = '清除所有學習與錯題紀錄'; }, 2000);
    }

    async function fetchDataFromUrl() {
        const url = document.getElementById('dbUrl').value.trim() || 'vocab-pro.txt';
        const btn = document.getElementById('fetchBtn');
        btn.innerText = "載入中..."; btn.disabled = true;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('檔案讀取失敗');
            const textData = await response.text();
            parseTextToDatabase(textData);
        } catch (err) {
            alert("載入失敗！\n錯誤：" + err.message);
        } finally {
            btn.innerText = "載入並儲存題庫"; btn.disabled = false;
        }
    }

    function processManualData() {
        const rawText = document.getElementById('rawText').value;
        if (!rawText.trim()) return alert("請貼上文字！");
        parseTextToDatabase(rawText);
    }

    function splitWordAndTranslation(line) {
        if (!/[\u4E00-\u9FFF]/.test(line)) return null;
        const splitRegex = /\s+(?=(?:(?:n|v|vt|vi|adj|adv|prep|conj|pron|int|aux|art|phr|pl|sing)\.|[\(\[（【](?:n|v|vt|vi|adj|adv|prep|conj|pron|int|aux|art|phr)\.?[\)\]）】]|[\u4E00-\u9FFF\u3000-\u303F\uFF00-\uFFEF]))/i;
        const idx = line.search(splitRegex);
        if (idx > 0) {
            const word = line.slice(0, idx).trim();
            const translation = line.slice(idx).trim();
            if (word && translation && /^[a-zA-Z]/.test(word)) {
                return { word, translation };
            }
        }
        const fallback = line.match(/^([a-zA-Z][a-zA-Z0-9\-\.\'\/]*)\s*([\u4E00-\u9FFF].*)$/);
        if (fallback) {
            return { word: fallback[1].trim(), translation: fallback[2].trim() };
        }
        return null;
    }

    function parseTextToDatabase(rawText) {
        const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== '');
        const db = []; let currentUnit = '1-1'; let currentWord = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (/^\d+-\d+$/.test(line)) { currentUnit = line; continue; }
            const parsed = splitWordAndTranslation(line);
            
            if (parsed && !currentWord) {
                currentWord = {
                    id: `${currentUnit}_${parsed.word}`, unit: currentUnit,
                    word: parsed.word, translation: parsed.translation, sentence: ''
                };
                continue;
            }
            if (currentWord) { currentWord.sentence = line; db.push(currentWord); currentWord = null; }
        }
        if (db.length === 0) return alert("解析失敗，請確認格式！");
        localStorage.setItem('vocabularyDatabase', JSON.stringify(db));
        wordDatabase = db;
        document.getElementById('setupMsg').innerText = `成功匯入 ${db.length} 個單字！`; 
        document.getElementById('setupMsg').style.display = 'block';
        setTimeout(() => showSection('configSection'), 800);
    }

    function repairWordItem(item) {
        if (!item || !item.word || !item.translation) return false;
        const combined = `${item.word} ${item.translation}`.trim();
        const fixed = splitWordAndTranslation(combined);
        if (fixed && (fixed.word !== item.word || fixed.translation !== item.translation)) {
            const oldId = item.id;
            item.word = fixed.word;
            item.translation = fixed.translation;
            item.id = `${item.unit}_${item.word}`;
            if (sm2Progress[oldId] && !sm2Progress[item.id]) {
                sm2Progress[item.id] = sm2Progress[oldId];
                delete sm2Progress[oldId];
            }
            return true;
        }
        return false;
    }

    function loadDatabase() {
        const savedDB = localStorage.getItem('vocabularyDatabase');
        if (savedDB) {
            wordDatabase = JSON.parse(savedDB);
            let dbChanged = false;
            wordDatabase.forEach(item => {
                if (repairWordItem(item)) dbChanged = true;
            });
            if (dbChanged) {
                localStorage.setItem('vocabularyDatabase', JSON.stringify(wordDatabase));
                localStorage.setItem('sm2Progress', JSON.stringify(sm2Progress));
            }
            if (casualState) {
                let casualChanged = false;
                ['pendingWords', 'reviewQueue', 'wrongPool'].forEach(key => {
                    if (Array.isArray(casualState[key])) {
                        casualState[key].forEach(item => {
                            if (repairWordItem(item)) casualChanged = true;
                        });
                    }
                });
                if (casualChanged) localStorage.setItem('casualSession', JSON.stringify(casualState));
            }
            showSection('configSection');
        } else {
            showSection('setupSection');
        }
        toggleModeDesc();
    }

    function saveUserPrefs() {
        const prefs = {
            mode: document.getElementById('quizMode').value,
            count: document.getElementById('optCount').value,
            order: document.getElementById('optOrder').value,
            startUnit: document.getElementById('startUnit').value,
            endUnit: document.getElementById('endUnit').value
        };
        localStorage.setItem('quizUserPrefs', JSON.stringify(prefs));
    }

    function updateConfigUI() {
        resetConfirmButtons();
        if(wordDatabase.length === 0) return;
        const units = [...new Set(wordDatabase.map(w => w.unit))].sort((a, b) => {
            const [a1, a2] = a.split('-').map(Number); const [b1, b2] = b.split('-').map(Number);
            return a1 !== b1 ? a1 - b1 : a2 - b2;
        });
        const startSel = document.getElementById('startUnit'); const endSel = document.getElementById('endUnit');
        startSel.innerHTML = ''; endSel.innerHTML = '';
        units.forEach(u => { startSel.add(new Option(u, u)); endSel.add(new Option(u, u)); });

        const savedPrefs = JSON.parse(localStorage.getItem('quizUserPrefs'));
        if (savedPrefs) {
            if (savedPrefs.mode) document.getElementById('quizMode').value = savedPrefs.mode;
            if (savedPrefs.count) document.getElementById('optCount').value = savedPrefs.count;
            if (savedPrefs.order) document.getElementById('optOrder').value = savedPrefs.order;
            if (savedPrefs.startUnit && units.includes(savedPrefs.startUnit)) {
                startSel.value = savedPrefs.startUnit;
            }
            if (savedPrefs.endUnit && units.includes(savedPrefs.endUnit)) {
                endSel.value = savedPrefs.endUnit;
            } else {
                endSel.selectedIndex = units.length - 1;
            }
            toggleModeDesc();
        } else {
            endSel.selectedIndex = units.length - 1;
        }

        document.getElementById('dbStats').innerHTML = `📦 總題庫量: <b>${wordDatabase.length} 字</b>`;
        document.getElementById('resumeBtn').style.display = casualState ? 'block' : 'none';
    }

    function startNewQuiz() {
        const btn = document.getElementById('startBtn');
        if (casualState && !btn.dataset.confirmed) {
            btn.dataset.confirmed = 'true';
            btn.innerText = '⚠️ 將覆蓋順順考進度，3 秒內再按一次確認';
            startConfirmTimer = setTimeout(() => {
                delete btn.dataset.confirmed;
                btn.innerText = '開始測驗';
            }, 3000);
            return;
        }

        clearTimeout(startConfirmTimer);
        delete btn.dataset.confirmed;
        btn.innerText = '開始測驗';

        saveUserPrefs();
        currentMode = document.getElementById('quizMode').value;
        quizSettings.count = parseInt(document.getElementById('optCount').value);
        quizSettings.order = document.getElementById('optOrder').value;

        const startU = document.getElementById('startUnit').value;
        const endU = document.getElementById('endUnit').value;
        const parseUnit = u => { const p = u.split('-'); return parseInt(p[0]) * 100 + parseInt(p[1]); };
        const sVal = parseUnit(startU); const eVal = parseUnit(endU);

        currentQuizPool = wordDatabase.filter(w => {
            const val = parseUnit(w.unit); return val >= sVal && val <= eVal;
        });

        if (currentQuizPool.length < quizSettings.count) return alert(`單字量不足以產生 ${quizSettings.count} 個選項`);

        if(currentMode === 'casual') initCasualMode(startU, endU);
        
        showSection('quizSection'); executeNext();
    }

    function resumeCasualSession() {
        if(!casualState) return;
        currentMode = 'casual'; quizSettings.count = casualState.optCount; currentQuizPool = wordDatabase; 
        showSection('quizSection'); executeNext();
    }

    // --- SM-2 演算法核心（錯題優先插隊 + 作答時間分級） ---
    function getNextSm2Word() {
        let reviewDue = currentQuizPool.filter(w => {
            const p = sm2Progress[w.id];
            return p && p.nextReview <= globalTurn;
        });

        if (reviewDue.length > 0) {
            reviewDue.sort((a, b) => {
                const pa = sm2Progress[a.id], pb = sm2Progress[b.id];
                if (pa.repetition !== pb.repetition) return pa.repetition - pb.repetition;
                return pa.nextReview - pb.nextReview;
            });
            const topUrgent = reviewDue.slice(0, 3);
            const candidates = topUrgent.filter(w => !currentQuestion || w.id !== currentQuestion.id);
            const pool = candidates.length > 0 ? candidates : topUrgent;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        let unseen = currentQuizPool.filter(w => !sm2Progress[w.id]);
        if (unseen.length > 0) {
            return unseen[Math.floor(Math.random() * unseen.length)];
        }

        let upcoming = [...currentQuizPool].sort((a, b) => sm2Progress[a.id].nextReview - sm2Progress[b.id].nextReview);
        return upcoming[0];
    }

    function evaluateResponseQuality(isCorrect, elapsedSec, sentence) {
        if (!isCorrect) return { quality: 1, label: '答錯重排' };

        const wordCount = sentence.trim().split(/\s+/).length;
        const fastLimit = Math.max(3.0, 1.5 + wordCount * 0.22);
        const slowLimit = fastLimit * 2.2;

        if (elapsedSec <= fastLimit) {
            return { quality: 5, label: '⚡ 秒殺記憶' };
        } else if (elapsedSec <= slowLimit) {
            return { quality: 4, label: '👍 正常穩健' };
        } else {
            return { quality: 3, label: '🤔 猶豫較久' };
        }
    }

    function handleSm2Answer(isCorrect, wordId, elapsedSec, sentence) {
        if (!sm2Progress[wordId]) sm2Progress[wordId] = { interval: 0, repetition: 0, efactor: 2.5, nextReview: 0 };
        let p = sm2Progress[wordId];
        globalTurn++;

        const { quality, label } = evaluateResponseQuality(isCorrect, elapsedSec, sentence);

        if (quality < 3) {
            p.repetition = 0;
            p.interval = 1;
            p.efactor = Math.max(1.3, p.efactor - 0.2);
        } else if (quality === 3) {
            if (p.repetition === 0) p.interval = 1;
            else p.interval = Math.max(1, Math.round(p.interval * 1.2));
            p.repetition++;
            p.efactor = Math.max(1.3, p.efactor - 0.14);
        } else if (quality === 4) {
            if (p.repetition === 0) p.interval = 2;
            else if (p.repetition === 1) p.interval = 6;
            else p.interval = Math.round(p.interval * p.efactor);
            p.repetition++;
        } else {
            if (p.repetition === 0) p.interval = 4;
            else if (p.repetition === 1) p.interval = 8;
            else p.interval = Math.round(p.interval * p.efactor * 1.2);
            p.repetition++;
            p.efactor = Math.min(3.0, p.efactor + 0.1);
        }

        p.nextReview = globalTurn + p.interval;
        localStorage.setItem('sm2Progress', JSON.stringify(sm2Progress));
        localStorage.setItem('globalTurn', globalTurn);

        return `${label}・下次間隔 ${p.interval} 題`;
    }

    // --- 順順考邏輯 ---
    function initCasualMode(startU, endU) {
        const parseUnit = u => { const p = u.split('-'); return parseInt(p[0]) * 100 + parseInt(p[1]); };
        const sVal = parseUnit(startU); const eVal = parseUnit(endU);
        const unitsInRange = [...new Set(wordDatabase.filter(w => { const val = parseUnit(w.unit); return val >= sVal && val <= eVal; }).map(w => w.unit))];

        casualState = { units: unitsInRange, currentUnit: '', pendingWords: [], reviewQueue: [], wrongPool: [], isReviewPhase: false, optCount: quizSettings.count, order: quizSettings.order };
        loadNextCasualUnit();
    }

    function loadNextCasualUnit() {
        if (casualState.units.length === 0) return false;
        casualState.currentUnit = casualState.units.shift();
        casualState.pendingWords = wordDatabase.filter(w => w.unit === casualState.currentUnit);
        if (casualState.order === 'random') casualState.pendingWords.sort(() => Math.random() - 0.5);
        return true;
    }

    function getNextCasualWord() {
        if (casualState.isReviewPhase) {
            if (casualState.reviewQueue.length > 0) return casualState.reviewQueue.shift();
            casualState.isReviewPhase = false;
            if (!loadNextCasualUnit()) {
                if (casualState.wrongPool.length > 0) {
                    casualState.isReviewPhase = true; casualState.reviewQueue = [...casualState.wrongPool];
                    if(casualState.order === 'random') casualState.reviewQueue.sort(() => Math.random() - 0.5);
                    casualState.wrongPool = []; return casualState.reviewQueue.shift();
                } else return null;
            }
            return getNextCasualWord();
        } else {
            if (casualState.pendingWords.length > 0) return casualState.pendingWords.shift();
            casualState.isReviewPhase = true; casualState.reviewQueue = [...casualState.wrongPool];
            if(casualState.order === 'random') casualState.reviewQueue.sort(() => Math.random() - 0.5);
            casualState.wrongPool = []; return getNextCasualWord();
        }
    }

    function handleCasualAnswer(isCorrect, wordObj) {
        if (!isCorrect) casualState.wrongPool.push(wordObj);
        localStorage.setItem('casualSession', JSON.stringify(casualState));
    }

    // --- 共用執行邏輯 ---
    function executeNext() {
        document.getElementById('feedbackBox').classList.remove('show');
        document.getElementById('optionsContainer').innerHTML = '';

        if (currentMode === 'sm2') {
            currentQuestion = getNextSm2Word();
        } else {
            currentQuestion = getNextCasualWord();
            if (!currentQuestion) {
                alert("🎉 恭喜！範圍內的所有題目與錯題均已全數破關！");
                localStorage.removeItem('casualSession'); casualState = null;
                showSection('configSection'); return;
            }
        }

        document.getElementById('questionText').innerText = createBlankSentence(currentQuestion.sentence, currentQuestion.word);
        let options = new Set([currentQuestion]);
        const poolToUse = currentMode === 'sm2' ? currentQuizPool : wordDatabase;
        while(options.size < quizSettings.count) { options.add(poolToUse[Math.floor(Math.random() * poolToUse.length)]); }
        
        const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
        const container = document.getElementById('optionsContainer');
        shuffled.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.dataset.id = opt.id;
            btn.innerText = opt.word.replace(/^[A-Z](?=[a-z])/, c => c.toLowerCase());
            btn.onclick = () => processUserAnswer(opt, shuffled, btn);
            container.appendChild(btn);
        });

        questionStartTime = Date.now();
        updateQuizUIState();
    }

    function processUserAnswer(selectedOpt, allOptions, selectedBtn) {
        const rawSec = (Date.now() - questionStartTime) / 1000;
        const elapsedSec = Math.min(rawSec, 30);

        document.querySelectorAll('.option-btn').forEach(b => {
            b.disabled = true;
            if (b.dataset.id === currentQuestion.id) b.classList.add('correct');
        });
        const isCorrect = selectedOpt.id === currentQuestion.id;
        if (!isCorrect) selectedBtn.classList.add('wrong');
        
        let sm2Note = '';
        if (currentMode === 'sm2') {
            sm2Note = handleSm2Answer(isCorrect, currentQuestion.id, elapsedSec, currentQuestion.sentence);
        } else {
            handleCasualAnswer(isCorrect, currentQuestion);
        }
        showFeedback(isCorrect, allOptions, rawSec, sm2Note);
        updateQuizUIState();
    }

    function getWordForms(singleWord) {
        const w = singleWord.toLowerCase();
        const safe = w.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const forms = [safe + '[a-z]*'];
        if (irregularMap[w]) {
            irregularMap[w].forEach(v => forms.push(v.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')));
        }
        if (w.endsWith('y') && w.length > 2) {
            forms.push(safe.slice(0, -1) + '(?:y|ied|ies|ying)[a-z]*');
        }
        if (w.endsWith('e') && w.length > 2) {
            forms.push(safe.slice(0, -1) + '(?:e|ed|ing|es)[a-z]*');
        }
        return `(?:${forms.join('|')})`;
    }

    function buildMatchRegex(word) {
        const clean = word.trim().toLowerCase();
        const parts = clean.split(/\s+/);
        if (parts.length > 1) {
            const firstForms = getWordForms(parts[0]);
            const rest = parts.slice(1).map(p => p.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')).join('\\s+');
            const joined = parts.join('').replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            return new RegExp(`\\b(?:${firstForms}\\s+${rest}|${joined}[a-z]*)\\b`, 'gi');
        }
        const singleForms = getWordForms(clean);
        const shortStem = clean.length > 4 ? clean.slice(0, 4).replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') : null;
        return new RegExp(`\\b(?:${singleForms}${shortStem ? '|' + shortStem + '[a-z]*' : ''})\\b`, 'gi');
    }

    function createBlankSentence(sentence, word) {
        const regex = buildMatchRegex(word);
        if (sentence.match(regex)) return sentence.replace(regex, '__________');
        const safeWord = word.trim().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        return sentence.replace(new RegExp(safeWord, 'i'), '__________');
    }

    function showFeedback(isCorrect, allOptions, rawSec, sm2Note) {
        const box = document.getElementById('feedbackBox');
        box.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
        document.getElementById('feedbackTitle').innerText = isCorrect ? '✔️ 答對了！' : '❌ 答錯了！正確答案是：';
        
        const timeStr = `${rawSec.toFixed(1)} 秒`;
        document.getElementById('fbTimeBadge').innerText = sm2Note ? `⏱️ ${timeStr}（${sm2Note}）` : `⏱️ ${timeStr}`;

        document.getElementById('fbWord').innerText = currentQuestion.word;
        document.getElementById('fbTranslation').innerText = `(${currentQuestion.translation})`;
        
        const regex = buildMatchRegex(currentQuestion.word);
        let hlSentence = currentQuestion.sentence;
        if(hlSentence.match(regex)) hlSentence = hlSentence.replace(regex, match => `<u><b>${match}</b></u>`);
        document.getElementById('fbSentence').innerHTML = hlSentence;

        const otherOpts = allOptions.filter(o => o.id !== currentQuestion.id);
        document.getElementById('fbOtherOptions').innerHTML = `<b>💡 選項解析</b><br>` + otherOpts.map(o => `• <b>${o.word}</b> : ${o.translation}`).join('<br>');
        document.getElementById('nextBtn').focus();
    }

    function updateQuizUIState() {
        const box = document.getElementById('quizStatsBox');
        if (currentMode === 'sm2') {
            let mastered = 0, learning = 0;
            currentQuizPool.forEach(w => {
                const p = sm2Progress[w.id];
                if (p && p.interval > 3) mastered++; else learning++;
            });
            box.innerHTML = `
                <div>📊 <b>SM-2 智慧調控</b></div>
                <div>熟練: <b style="color:var(--success)">${mastered}</b></div>
                <div>學習中/待加強: <b style="color:var(--warning)">${learning}</b></div>`;
        } else {
            const isRev = casualState.isReviewPhase;
            const stateStr = isRev ? `<span class="badge">錯題結算</span>` : `<span style="color:var(--primary); font-weight:bold;">${casualState.currentUnit}</span>`;
            const leftCount = isRev ? casualState.reviewQueue.length : casualState.pendingWords.length;
            box.innerHTML = `
                <div>進度: ${stateStr}</div>
                <div>剩餘: <b>${leftCount} 題</b></div>
                <div>錯題池: <b style="color:var(--danger)">${casualState.wrongPool.length}</b></div>`;
        }
    }

    function nextQuestion() { executeNext(); }
    document.addEventListener('keypress', e => {
        if (e.key === 'Enter') {
            const fBox = document.getElementById('feedbackBox');
            if (fBox.classList.contains('show')) nextQuestion();
        }
    });

    ['quizMode', 'optCount', 'optOrder', 'startUnit', 'endUnit'].forEach(id => {
        document.getElementById(id).addEventListener('change', saveUserPrefs);
    });

    loadDatabase();
</script>
